services:
  ski-bindings:
    build: .
    ports:
      # Published on every host interface. Note that Docker-published ports bypass
      # ufw/firewalld rules. If your reverse proxy runs on this same host, prefer
      #   - "127.0.0.1:8000:8000"
      # so the app is only reachable through the proxy.
      - "8000:8000"
    volumes:
      # Mount templates directory so you can update binding_db.json without rebuilding
      - ./templates:/srv/templates:ro
    # --- Containment: it only serves files, so it gets nothing else ---
    read_only: true
    tmpfs:
      - /tmp:size=8m
    environment:
      - XDG_DATA_HOME=/tmp
      - XDG_CONFIG_HOME=/tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    cpus: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
